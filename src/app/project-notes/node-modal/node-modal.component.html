<div class="google-dialog node-dialog" (click)="onBackdropClick($event)">
  <div class="dialog-overlay" (click)="requestClose()"></div>

  <div class="dialog-content node-dialog-content" *ngIf="node">
    <div class="dialog-header node-dialog-header">
      <div class="node-heading">
        <span class="node-path" *ngIf="pathLabel" [title]="pathLabel">{{ pathLabel }}</span>
        <h3 class="dialog-title">Point details</h3>
      </div>
      <button class="dialog-close" (click)="requestClose()" title="Close (Esc)" aria-label="Close">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
        </svg>
      </button>
    </div>

    <div class="dialog-body node-dialog-body">
      <!-- Title -->
      <label class="google-input-label" for="nodeTitle">Title</label>
      <input
        id="nodeTitle"
        type="text"
        class="google-input node-title-input"
        [(ngModel)]="title"
        (ngModelChange)="onTitleInput()"
        (keydown)="onTitleKeydown($event)"
        placeholder="What is this point about?"
        autocomplete="off"
      />

      <!-- Description -->
      <div class="field">
        <label class="google-input-label" for="nodeDescription">Description</label>
        <textarea
          id="nodeDescription"
          class="google-input google-input-textarea description-input"
          [(ngModel)]="description"
          (ngModelChange)="onDescriptionInput()"
          (input)="autosize($event)"
          rows="3"
          placeholder="Short summary of this point"></textarea>
      </div>

      <!-- Notes -->
      <div class="field">
        <div class="field-heading">
          <span class="google-input-label">Notes</span>
          <span class="field-hint">Enter adds a line &middot; empty line + Backspace removes it</span>
        </div>
        <div class="note-editor">
          <div class="note-line" *ngFor="let line of noteLines; let i = index">
            <button
              type="button"
              class="note-check"
              [class.note-check-done]="line.checked"
              (click)="line.checked = !line.checked; onNoteInput()"
              [attr.aria-label]="line.checked ? 'Mark line as not done' : 'Mark line as done'"
            >
              <svg *ngIf="line.checked" xmlns="http://www.w3.org/2000/svg" height="14" viewBox="0 0 24 24" width="14">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/>
              </svg>
            </button>
            <textarea
              class="note-line-input"
              [class.note-line-done]="line.checked"
              [(ngModel)]="line.text"
              (ngModelChange)="onNoteInput()"
              (keydown)="onNoteKeydown($event, i)"
              (input)="autosize($event)"
              rows="1"
              placeholder="Write a note..."
            ></textarea>
          </div>
        </div>
      </div>

      <!-- Links -->
      <div class="field">
        <span class="google-input-label">Links</span>
        <div class="link-list" *ngIf="links.length > 0">
          <div class="link-row" *ngFor="let link of links; let i = index">
            <span class="link-icon">
              <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
                <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z" fill="currentColor"/>
              </svg>
            </span>
            <a class="link-body" [href]="linkHref(link.url)" target="_blank" rel="noopener noreferrer">
              <span class="link-label">{{ link.label || linkHost(link.url) }}</span>
              <span class="link-url">{{ linkHost(link.url) }}</span>
            </a>
            <button class="icon-button" (click)="removeLink(i)" title="Remove link" aria-label="Remove link">
              <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
                <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="link-add">
          <input
            #linkLabelInput
            type="text"
            class="google-input"
            [(ngModel)]="linkDraft.label"
            placeholder="Label (optional)"
            autocomplete="off"
          />
          <input
            type="text"
            class="google-input"
            [(ngModel)]="linkDraft.url"
            (keydown.enter)="addLink()"
            placeholder="https://..."
            autocomplete="off"
          />
          <button class="google-btn google-btn-secondary" (click)="addLink()">Add link</button>
        </div>
        <p class="field-error" *ngIf="linkError">{{ linkError }}</p>
      </div>

      <!-- Images -->
      <div class="field">
        <span class="google-input-label">Images</span>
        <div class="image-grid" *ngIf="images.length > 0">
          <figure class="image-card" *ngFor="let image of images; let i = index">
            <button class="image-thumb" (click)="openPreview(image)" title="Open image">
              <img [src]="image.src" [alt]="image.caption || 'Point image'" loading="lazy" />
            </button>
            <input
              class="image-caption"
              type="text"
              [ngModel]="image.caption"
              (ngModelChange)="updateCaption(i, $event)"
              placeholder="Caption"
            />
            <button class="image-remove" (click)="removeImage(i)" title="Remove image" aria-label="Remove image">
              <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 0 24 24" width="16">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
              </svg>
            </button>
          </figure>
        </div>

        <label class="image-upload">
          <input type="file" accept="image/*" multiple (change)="onFilesPicked($event)" />
          <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
            <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
          </svg>
          Add images
        </label>
      </div>
    </div>

    <div class="dialog-actions node-dialog-actions">
      <span class="saved-label">
        <svg xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 0 24 24" width="16">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/>
        </svg>
        {{ updatedLabel }}
      </span>
      <span class="actions-spacer"></span>
      <button class="google-btn google-btn-danger-outline" (click)="deletePoint()">Delete</button>
      <button class="google-btn google-btn-secondary" (click)="addChildPoint()">
        <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
        </svg>
        Add subpoint
      </button>
      <button class="google-btn" (click)="requestClose()">Done</button>
    </div>
  </div>

  <!-- Full-size image -->
  <div class="image-preview" *ngIf="previewImage" (click)="closePreview()">
    <img [src]="previewImage.src" [alt]="previewImage.caption || 'Point image'" />
    <span class="image-preview-caption" *ngIf="previewImage.caption">{{ previewImage.caption }}</span>
  </div>
</div>
