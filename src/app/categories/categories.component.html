<div class="page-container">
  <app-header></app-header>

  <div class="page-content">
    <div class="categories-container">
      <div class="page-heading">
        <div>
          <h2>Categories</h2>
          <p>Browse all your videos by category.</p>
        </div>
        <div class="heading-actions">
          <button class="google-btn google-btn-secondary" (click)="openExercises()">
            <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20">
              <path d="M0 0h24v24H0V0z" fill="none"/>
              <path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm-2 14l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z" fill="currentColor"/>
            </svg>
            Exercises
          </button>
          <button class="google-btn google-btn-secondary" (click)="goHome()">Dashboard</button>
        </div>
      </div>

      <div class="category-grid" *ngIf="categories.length > 0; else noCategories">
        <button *ngFor="let category of categories" class="category-card" (click)="openCategory(category)">
          <img class="category-image" [src]="categoryImages.get(category)" [alt]="category + ' category thumbnail'" loading="lazy" />
          <span class="category-name">{{ category }}</span>
          <span class="category-arrow">View videos &rarr;</span>
        </button>
      </div>

      <ng-template #noCategories>
        <div class="empty-state">
          <h3>No categories yet</h3>
          <p>Add a category while creating or editing a video to see it here.</p>
          <button class="google-btn" (click)="goHome()">Back to Dashboard</button>
        </div>
      </ng-template>    </div>
  </div>
</div>
