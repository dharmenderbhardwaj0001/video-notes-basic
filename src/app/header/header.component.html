<div class="page-header">
  <div class="header-left">
    <div class="logo" (click)="goHome()" title="Go to home">
      <img class="logo-icon" src="favicon.svg" alt="Video Notes logo" />
      <h1 class="app-title">Video Notes</h1>
    </div>
  </div>
  <div class="header-right">
    <button
      *ngIf="actionLabel"
      class="google-btn google-btn-secondary"
      (click)="triggerAction()"
    >
      <svg *ngIf="actionIcon === 'add'" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20">
        <path d="M0 0h24v24H0V0z" fill="none"/>
        <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z" fill="currentColor"/>
      </svg>
      <svg *ngIf="actionIcon === 'save'" xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 0 24 24" width="20">
        <path d="M0 0h24v24H0V0z" fill="none"/>
        <path d="M17 3H7c-1.1 0-2 .9-2 2v16l7-3 7 3V5c0-1.1-.9-2-2-2zm0 15l-5-2.18L7 18V5h10v13z" fill="currentColor"/>
      </svg>
      <span>{{ actionLabel }}</span>
    </button>
    <div class="theme-picker" (click)="$event.stopPropagation()">
      <button
        class="storage-btn"
        (click)="toggleThemePopup()"
        title="Change theme"
      >
        <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
          <path d="M0 0h24v24H0V0z" fill="none"/>
          <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4c-.83 0-1.5-.67-1.5-1.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z" fill="currentColor"/>
        </svg>
      </button>
      <div class="theme-popup" *ngIf="showThemePopup" (click)="$event.stopPropagation()">
        <div class="theme-popup-title">Theme</div>
        <div class="theme-popup-list">
          <button
            *ngFor="let theme of themes"
            class="theme-option"
            [class.theme-option-active]="theme.id === currentTheme"
            (click)="selectTheme(theme.id)"
          >
            <span class="theme-swatches">
              <span class="swatch" *ngFor="let color of theme.colors" [style.background-color]="color"></span>
            </span>
            <span class="theme-option-name">{{ theme.name }}</span>
            <svg *ngIf="theme.id === currentTheme" xmlns="http://www.w3.org/2000/svg" height="16" viewBox="0 0 24 24" width="16" class="theme-option-check">
              <path d="M0 0h24v24H0V0z" fill="none"/>
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
    <button
      class="storage-btn"
      [class.storage-btn-connected]="storageConnected"
      (click)="connectStorage()"
      [title]="storageConnected
        ? 'Data is saved to ' + storageFolderName + '/video-notes.json'
        : (storageHint || 'Connect the notes folder in this project to store your data (picked once, then remembered)')"
    >
      <svg xmlns="http://www.w3.org/2000/svg" height="18" viewBox="0 0 24 24" width="18">
        <path
          *ngIf="!storageConnected"
          d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"
          fill="currentColor"
        />
        <path
          *ngIf="storageConnected"
          d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2zm-1 12l-4-4 1.41-1.41L9 13.17l6.59-6.59L17 8l-8 8z"
          fill="currentColor"
        />
      </svg>
    </button>
    <div class="user-info" (click)="openNameDialog()" title="Set your name">
      <div class="user-avatar">{{ (displayName || 'U').charAt(0).toUpperCase() }}</div>
      <span>{{ greeting }}</span>
    </div>
  </div>
</div>

<!-- Name dialog -->
<div class="google-dialog" *ngIf="showNameDialog">
  <div class="dialog-overlay" (click)="closeNameDialog()"></div>
  <div class="dialog-content">
    <div class="dialog-header">
      <h3 class="dialog-title">What's your name?</h3>
      <button class="dialog-close" (click)="closeNameDialog()">
        <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="dialog-body">
      <label class="google-input-label" for="userName">Your name</label>
      <input
        id="userName"
        type="text"
        class="google-input"
        [(ngModel)]="draftName"
        (keydown)="onNameKeydown($event)"
        placeholder="Enter your name"
        autofocus
      />
      <p class="name-hint">Your name is saved with your data in the notes folder on your PC.</p>
    </div>
    <div class="dialog-actions">
      <button class="google-btn google-btn-secondary" (click)="closeNameDialog()">Cancel</button>
      <button class="google-btn" (click)="saveName()">Save</button>
    </div>
  </div>
</div>
