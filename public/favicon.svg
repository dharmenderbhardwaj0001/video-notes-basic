<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fd4f7"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffedb0"/>
      <stop offset="45%" stop-color="#f7c14b"/>
      <stop offset="100%" stop-color="#c8891a"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
  </defs>

  <!-- Tile with glossy top light for a glassy 3D feel -->
  <g clip-path="url(#rounded)">
    <rect width="64" height="64" fill="url(#tile)"/>
    <ellipse cx="32" cy="6" rx="36" ry="22" fill="#ffffff" opacity="0.22"/>
    <rect y="46" width="64" height="18" fill="#0369a1" opacity="0.35"/>
  </g>

  <!-- Extruded 3D "V": dark base below, golden face on top -->
  <path d="M18 20 L32 45 L46 20" transform="translate(0, 2.5)"
        fill="none" stroke="#8a5f0a" stroke-width="9.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M18 20 L32 45 L46 20"
        fill="none" stroke="url(#gold)" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Specular edge highlight -->
  <path d="M18 18.5 L30.5 42" transform="translate(-0.5, -1.5)"
        fill="none" stroke="#ffffff" stroke-width="2" opacity="0.45"
        stroke-linecap="round"/>
</svg>
